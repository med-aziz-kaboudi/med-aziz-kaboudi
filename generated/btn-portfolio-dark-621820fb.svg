<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="162" height="50" viewBox="0 0 162 50" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.sh{animation:sh 5s ease-in-out 1s infinite}
@keyframes sh{from{transform:translateX(-120px)}40%,100%{transform:translateX(202px)}}

</style>

<defs><clipPath id="b"><rect x="1" y="1" width="160" height="48" rx="14"/></clipPath>
<linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#79c0ff" stop-opacity="0"/><stop offset=".5" stop-color="#79c0ff" stop-opacity=".2"/><stop offset="1" stop-color="#79c0ff" stop-opacity="0"/></linearGradient></defs>
<rect x="1" y="1" width="160" height="48" rx="14" fill="#151b24" stroke="#2a3240"/>
<g clip-path="url(#b)"><g class="sh"><rect x="0" y="0" width="90" height="50" fill="url(#s)" transform="skewX(-15)"/></g></g>
<g transform="translate(19 14) scale(0.92)"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M2 12h20 M12 2a15 15 0 0 1 0 20 M12 2a15 15 0 0 0 0 20" fill="none" stroke="#79c0ff" stroke-width="2.18" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="52" y="31" font-size="15" font-weight="700" letter-spacing=".2" fill="#f0f4fa">Portfolio</text>

