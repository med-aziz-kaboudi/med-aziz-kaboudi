<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="96" viewBox="0 0 600 96" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

</style>

<text x="300" y="32" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="-.4" fill="#f0f4fa">Tic-Tac-Toe</text>
<text x="300" y="58" text-anchor="middle" font-size="14" fill="#8b949e">Last game was a draw, board cleared. Click any square to start.</text>
<g transform="translate(300 86)" font-size="12" class="mono" fill="#6e7681"><text x="-86" y="0" fill="#79c0ff" font-weight="800">X</text><text x="-72" y="0">YOU</text><text x="6" y="0" fill="#ffc93c" font-weight="800">O</text><text x="20" y="0">MY BOT</text></g>

</svg>
