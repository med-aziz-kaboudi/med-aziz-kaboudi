<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="104" height="104" viewBox="0 0 104 104" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.ink{animation:ink .5s ease-out -0.6s both}
@keyframes ink{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.empty{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.7}}

</style>
<rect x="4" y="4" width="96" height="96" rx="18" fill="#f6f8fa" stroke="#d0d7de"/><circle cx="52" cy="52" r="4" fill="#818b98" class="empty"/>
</svg>
