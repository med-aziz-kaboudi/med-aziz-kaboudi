<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="130" height="50" viewBox="0 0 130 50" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.sh{animation:sh 5s ease-in-out 1s infinite}
@keyframes sh{from{transform:translateX(-120px)}40%,100%{transform:translateX(170px)}}

</style>

<defs><clipPath id="b"><rect x="1" y="1" width="128" height="48" rx="14"/></clipPath>
<linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#218bff" stop-opacity="0"/><stop offset=".5" stop-color="#218bff" stop-opacity=".2"/><stop offset="1" stop-color="#218bff" stop-opacity="0"/></linearGradient></defs>
<rect x="1" y="1" width="128" height="48" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g clip-path="url(#b)"><g class="sh"><rect x="0" y="0" width="90" height="50" fill="url(#s)" transform="skewX(-15)"/></g></g>
<g transform="translate(19 14) scale(0.92)"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z M3.5 6.5 12 13l8.5-6.5" fill="none" stroke="#218bff" stroke-width="2.18" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="52" y="31" font-size="15" font-weight="700" letter-spacing=".2" fill="#1f2328">Email</text>

</svg>
