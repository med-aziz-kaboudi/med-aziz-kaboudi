<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="50" height="348" viewBox="0 0 50 348" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.drop{animation:drop .75s cubic-bezier(.45,0,.75,1.25) both}
@keyframes drop{from{transform:translateY(var(--d))}to{transform:none}}
.bob{animation:bob 1.6s ease-in-out 0.36s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

</style>

<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#1b5fc4"/></linearGradient>
  <clipPath id="frame"><rect x="-30" y="40" width="110" height="308" rx="16"/></clipPath>
  <mask id="holes"><rect x="0" y="0" width="50" height="348" fill="#fff"/><circle cx="25" cy="65" r="19" fill="#000"/><circle cx="25" cy="115" r="19" fill="#000"/><circle cx="25" cy="165" r="19" fill="#000"/><circle cx="25" cy="215" r="19" fill="#000"/><circle cx="25" cy="265" r="19" fill="#000"/><circle cx="25" cy="315" r="19" fill="#000"/></mask>
</defs>
<g class="bob" opacity="1">
  <rect x="7" y="6" width="36" height="26" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <path d="M19 15l6 6 6-6" fill="none" stroke="#ff4d6d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g clip-path="url(#frame)">
  <rect x="0" y="40" width="50" height="308" fill="#ffffff"/>
  <g class="drop" style="--d:-310px;animation-delay:0s"><circle cx="25" cy="315" r="20" fill="#ff4d6d"/><circle cx="25" cy="315" r="13" fill="none" stroke="#000" stroke-opacity=".15" stroke-width="2.5"/></g>
  <rect x="0" y="40" width="50" height="308" fill="url(#bd)" mask="url(#holes)"/>
</g>

</svg>
