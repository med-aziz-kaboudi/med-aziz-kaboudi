<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

@keyframes o0{to{transform:translateY(-864px)}}.o0{animation:o0 2s cubic-bezier(.15,.85,.25,1) 0.2s both}
@keyframes o1{to{transform:translateY(-1152px)}}.o1{animation:o1 2.12s cubic-bezier(.15,.85,.25,1) 0.3s both}
@keyframes o2{to{transform:translateY(-1080px)}}.o2{animation:o2 2.24s cubic-bezier(.15,.85,.25,1) 0.4s both}
@keyframes o3{to{transform:translateY(-720px)}}.o3{animation:o3 2.54s cubic-bezier(.15,.85,.25,1) 0.4s both}
@keyframes o4{to{transform:translateY(-936px)}}.o4{animation:o4 2.36s cubic-bezier(.15,.85,.25,1) 0.5s both}
text{font-variant-numeric:tabular-nums}
.late{animation:late .6s ease 1.6s both}
@keyframes late{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.charge{animation:charge 2.2s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left}
@keyframes charge{from{transform:scaleX(0)}to{transform:scaleX(1)}}

