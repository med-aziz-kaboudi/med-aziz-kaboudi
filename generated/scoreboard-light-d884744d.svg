.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

@keyframes o0{to{transform:translateY(-624px)}}.o0{animation:o0 2s cubic-bezier(.15,.85,.25,1) 0.2s both}
@keyframes o1{to{transform:translateY(-624px)}}.o1{animation:o1 2.12s cubic-bezier(.15,.85,.25,1) 0.3s both}
