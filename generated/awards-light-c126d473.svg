<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.row{animation:row .7s cubic-bezier(.16,1,.3,1) both}@keyframes row{from{opacity:0}to{opacity:1}}
</style>

<text x="0" y="16" class="mono" font-size="12.5" letter-spacing="2" fill="#818b98">HACKATHONS</text>
