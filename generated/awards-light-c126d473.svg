<g class="row" style="animation-delay:0s" transform="translate(0 40)">
  <circle cx="24" cy="22" r="22" fill="#f5c451" fill-opacity=".14" stroke="#f5c451" stroke-width="2"/>
  <text x="24" y="27" text-anchor="middle" font-size="11.5" font-weight="800" fill="#f5c451">1ST</text>
  <text x="62" y="18" font-size="17" font-weight="700" fill="#1f2328">Imaginary-ai</text>
