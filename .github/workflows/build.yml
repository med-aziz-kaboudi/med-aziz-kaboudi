name: Build profile

# Redraws every image and the README. Daily for fresh contribution data, on
# every push that changes the content or the code, and on demand.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/profile.mjs', 'scripts/**', 'assets/**', '.github/workflows/build.yml']

permissions:
  contents: write

# Shared with the game so two runs never race to push.
concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch contribution calendar
        run: node scripts/fetch-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/stats.json /tmp/stats.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/stats.json data/stats.json
            node scripts/render.mjs
            git add -A README.md generated data/stats.json
            git diff --cached --quiet && break
            git commit -q -m "Redraw profile"
            git push -q origin HEAD:main && break
            sleep $((i * 3))
          done

      - name: Snake from my own contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
